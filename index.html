<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CO3020 計算機組織：互動式學習與動態題庫系統</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- KaTeX 數學公式即時渲染 CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>

  <!-- 頂部導航欄 -->
  <header class="navbar">
    <div>
      <div class="brand-title">
        <span>⚡</span> CO3020 計算機組織：互動式動態題庫與轉譯實驗室
      </div>
      <div class="brand-subtitle">
        整合 Chapter 1 & Chapter 2 投影片精華、Assignment 實戰題型與隨機自評系統
      </div>
    </div>
    <div class="nav-controls">
      <button id="themeToggleBtn" class="theme-toggle-btn">☀️ 切換淺色模式</button>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="container">
    
    <!-- 標籤導航欄 -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="tabCheatSheet">📖 重點精華與公式速查</button>
      <button class="tab-btn" data-tab="tabCalcArena">🎯 動態計算題庫 (隨機出題 & 驗證)</button>
      <button class="tab-btn" data-tab="tabTranslation">⚙️ C / MIPS 雙向轉譯實驗室 (12 大題型)</button>
      <button class="tab-btn" data-tab="tabMockExam">📝 全真模擬隨機測驗</button>
      <button class="tab-btn" data-tab="tabExpansionGuide">🚀 新增講義擴充指南</button>
    </nav>

    <!-- 標籤頁 1：重點精華與公式手冊 -->
    <section id="tabCheatSheet" class="tab-content active">
      <div id="cheatSheetContainer"></div>
    </section>

    <!-- 標籤頁 2：動態計算題庫 -->
    <section id="tabCalcArena" class="tab-content">
      <div class="filter-bar" id="calcFilterContainer"></div>
      <div id="calculationArenaContainer"></div>
    </section>

    <!-- 標籤頁 3：C/MIPS 雙向轉譯實驗室 -->
    <section id="tabTranslation" class="tab-content">
      <div class="filter-bar" id="transFilterContainer"></div>
      <div id="translationLabContainer"></div>
    </section>

    <!-- 標籤頁 4：全真模擬隨機測驗 -->
    <section id="tabMockExam" class="tab-content">
      <div class="card" style="text-align: center; padding: 2rem;">
        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--primary);">📝 計算機組織全真動態模擬考</h2>
        <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto 1.5rem auto;">
          系統將自所有已收錄章節中隨機抽取 5 道計算題並產生全新隨機數值。作答完畢後一鍵提交，系統將立即給予分數、標註答錯題型並自動展開逐步推導詳解。
        </p>
        <button id="startExamBtn" class="action-btn btn-primary" style="font-size: 1rem; padding: 0.75rem 1.75rem;">
          🚀 開始動態抽題模擬考
        </button>
      </div>

      <div id="examScoreboard" class="exam-scoreboard" style="display: none;"></div>
      <div id="examActiveArea" style="display: none;"></div>

      <div style="text-align: center; margin-top: 1.5rem;">
        <button id="submitExamBtn" class="action-btn btn-primary" style="display: none; font-size: 1rem; padding: 0.75rem 2rem;">
          📊 繳交試卷並計算成績
        </button>
      </div>
    </section>

    <!-- 標籤頁 5：講義擴充指南 -->
    <section id="tabExpansionGuide" class="tab-content">
      <div id="expansionGuideContainer"></div>
    </section>

  </main>

  <!-- 引入資料與核心邏輯模組 (無模組化限制，本機直接雙擊 index.html 即可正常運行) -->
  <script src="js/engine/solver.js"></script>
  <script src="js/data/chapter1.js"></script>
  <script src="js/data/chapter2.js"></script>
  <script src="js/data/translations.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
